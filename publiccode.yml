description:
  en:
    shortDescription: >-
      Open-source infrastructure for community ownership, identity, privacy, federation
      and portability.
    longDescription: >-
      Open Communities Core (OCC) lets people and organisations create, administer, transfer
      and move private digital communities, whether the initiative comes from an institution
      or from the members themselves. It owns the canonical model for identity, communities,
      membership, roles, policies and governance. Federation over ActivityPub and portability
      between instances are adapters on top of that model. Communities are private by default
      and can choose to be discoverable or federated. The first application built on OCC is a
      platform for early-education communities.
    features:
      - Community lifecycle independent of any organisation
      - Governance as policy, with auditable transfer of control
      - Private by default; optional ActivityPub federation
      - Community portability between instances
