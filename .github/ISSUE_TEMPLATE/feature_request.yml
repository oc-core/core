name: Feature request
description: Propose a change or an addition
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: Problem
      description: What is hard or impossible today, for whom.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposal
      description: What you would like to see. If it changes architecture, it will become an ADR.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives considered
