#
# Every commit in a pull request must carry a Developer Certificate of Origin sign-off
# (`git commit -s`). See CONTRIBUTING.md. Dependabot's own pull requests are exempt: its
# commits are generated by GitHub and carry no sign-off.
name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    name: Sign-off present on every commit
    runs-on: ubuntu-24.04
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Signed-off-by trailers
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0
          for sha in $(git rev-list --no-merges "$base".."$head"); do
            if ! git show -s --format=%B "$sha" | grep -qE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::commit $sha has no Signed-off-by trailer"
              missing=1
            fi
          done
          exit $missing
